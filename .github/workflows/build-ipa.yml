name: Build IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build NovaVM
        run: |
          cd vm-app
          xcodebuild -project NovaVM.xcodeproj \
            -scheme NovaVM \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          APP_PATH="vm-app/build/Build/Products/Release-iphoneos/NovaVM.app"
          test -d "$APP_PATH" || { echo "App not found at $APP_PATH"; exit 1; }
          rm -rf Payload NovaVM-*.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "NovaVM-${VERSION}.ipa" Payload
          ls -la NovaVM-*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaVM-ipa
          path: NovaVM-*.ipa
          if-no-files-found: error
